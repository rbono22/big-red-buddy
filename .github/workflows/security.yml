name: Security and isolation checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "27 8 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          # Isolated disposable CI service only; production always uses SCRAM.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: node scripts/check-deployment.mjs --require-docker
      - name: Validate proxy configuration
        run: docker run --rm -e APP_DOMAIN=assistant.example.edu -e ACME_EMAIL=operator@example.edu -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Build runtime image
        run: docker build --tag dabas-ci .
      - name: Verify image uses a nonroot account
        run: test "$(docker image inspect dabas-ci --format '{{.Config.User}}')" = node
