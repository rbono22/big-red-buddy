<!doctype html><html><head><title>Job Application for Example Strategist at Example Co</title></head><body>
<form id="application-form">
 <div class="field"><label for="first_name">First Name*</label><input id="first_name" required></div>
 <div class="field"><label for="email">Email*</label><input id="email" required></div>
 <div class="file-upload" role="group" aria-labelledby="upload-label-resume" aria-required="true"><div id="upload-label-resume">Resume/CV*</div><label for="resume">Attach</label><input id="resume" type="file"></div>
 <fieldset class="checkbox" id="question_100[]" aria-required="true"><legend class="label checkbox__description">Which countries could you work in? <span class="required">*</span></legend>
  <div class="checkbox__wrapper"><input type="checkbox" required id="question_100[]_1" name="question_100[]" value="1"><label for="question_100[]_1">United States</label></div>
  <div class="checkbox__wrapper"><input type="checkbox" required id="question_100[]_2" name="question_100[]" value="2"><label for="question_100[]_2">Canada</label></div>
  <div class="checkbox__wrapper"><input type="checkbox" required id="question_100[]_3" name="question_100[]" value="3"><label for="question_100[]_3">Ireland</label></div>
 </fieldset>
 <div class="select"><label id="question_200[]-label" for="question_200[]">Which cities are you available to work in?*</label><div class="select-shell"><div class="select__value-container select__value-container--is-multi"><input id="question_200[]" role="combobox" aria-required="true" aria-expanded="false" aria-labelledby="question_200[]-label"></div></div></div>
 <fieldset class="checkbox" id="question_300[]"><legend class="label checkbox__description">Optional: groups you are part of</legend>
  <div class="checkbox__wrapper"><input type="checkbox" id="question_300[]_1" name="question_300[]" value="1"><label for="question_300[]_1">Group A</label></div>
  <div class="checkbox__wrapper"><input type="checkbox" id="question_300[]_2" name="question_300[]" value="2"><label for="question_300[]_2">Group B</label></div>
 </fieldset>
 <button type="submit">Submit application</button>
</form></body></html>
